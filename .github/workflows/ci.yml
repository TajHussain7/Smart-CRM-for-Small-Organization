name: CI — Build & Type-check

# ─── Triggers ─────────────────────────────────────────────────────────────────
# Runs on every push and pull request to any branch.
# This ensures code quality is verified before merging into develop or main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Backend type-check and build validation
  # ─────────────────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend — TypeScript check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run typecheck

      - name: Run production build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend lint and production build validation
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/web/project

    env:
      # Provide a placeholder so Vite does not warn about missing env var during CI build.
      # The real value is set in Vercel environment variables.
      VITE_API_BASE_URL: https://placeholder-ci-build.onrender.com/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web/project/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build
