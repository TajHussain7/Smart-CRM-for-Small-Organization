name: CD — Deploy Backend to Render

# ─── Triggers ─────────────────────────────────────────────────────────────────
# Runs when code is merged or pushed directly to develop or main.
# Note: Frontend deployment is handled automatically by Vercel's GitHub integration.
on:
  push:
    branches:
      - develop
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Backend to Render via Webhook Deploy Hooks
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Staging Backend (develop)
        if: github.ref == 'refs/heads/develop'
        env:
          HOOK_URL: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEV_DEPLOY_HOOK secret is not set in repository settings. Skipping Render deploy."
          else
            curl -f -X POST "$HOOK_URL"
          fi

      - name: Deploy Production Backend (main)
        if: github.ref == 'refs/heads/main'
        env:
          HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_PROD_DEPLOY_HOOK secret is not set in repository settings. Skipping Render deploy."
          else
            curl -f -X POST "$HOOK_URL"
          fi

